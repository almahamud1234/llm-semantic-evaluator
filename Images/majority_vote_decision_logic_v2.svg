<!-- ══ Converge to Majority Vote — clean T-junction ══
     All 3 run boxes drop to a shared horizontal bar at y=322,
     then single vertical stem down to majority vote box top.
-->
<!-- vertical drops from each run result box bottom (y=286) to bar y=322 -->
<line x1="120" y1="286" x2="120" y2="322" stroke="rgb(34,34,34)" stroke-width="1.1"/>
<line x1="340" y1="286" x2="340" y2="322" stroke="rgb(34,34,34)" stroke-width="1.1"/>
<line x1="560" y1="286" x2="560" y2="322" stroke="rgb(34,34,34)" stroke-width="1.1"/>
<!-- horizontal collector bar -->
<line x1="120" y1="322" x2="560" y2="322" stroke="rgb(34,34,34)" stroke-width="1.1"/>
<!-- single stem down to majority vote -->
<line x1="340" y1="322" x2="340" y2="354" stroke="rgb(34,34,34)" stroke-width="1.1" marker-end="url(#arr)"/>

<!-- ══ Majority vote box ══ -->
<rect x="220" y="354" width="240" height="36" rx="5" fill="rgb(255,255,255)" stroke="rgb(51,51,51)" stroke-width="0.9"/>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" fill="rgb(17,17,17)" font-family="sans-serif" font-size="12" font-weight="600">Majority vote</text>
<text x="340" y="382" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,68)" font-family="sans-serif" font-size="10.5">PassedRunsCount ≥ MinimumPassingRuns (2)</text>

<!-- Count annotation -->
<text x="340" y="404" text-anchor="middle" fill="rgb(85,85,85)" font-family="sans-serif" font-size="10">2 passed out of 3  →  2 ≥ 2  →  overall PASS</text>

<line x1="340" y1="390" x2="340" y2="420" stroke="rgb(34,34,34)" stroke-width="1.1" marker-end="url(#arr)"/>

<!-- ══ Final result ══ -->
<rect x="230" y="420" width="220" height="44" rx="6" fill="rgb(255,255,255)" stroke="rgb(17,17,17)" stroke-width="1.5"/>
<text x="340" y="437" text-anchor="middle" dominant-baseline="central" fill="rgb(17,17,17)" font-family="sans-serif" font-size="12" font-weight="600">Test case: PASS</text>
<text x="340" y="454" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,68)" font-family="sans-serif" font-size="10.5">PassedRuns 2 / 3  ·  meets threshold</text>

<!-- Example values annotation bottom -->
<text x="120" y="496" text-anchor="middle" fill="rgb(85,85,85)" font-family="sans-serif" font-size="10">e.g. Emb: 0.45 (fail)</text>
<text x="120" y="508" text-anchor="middle" fill="rgb(85,85,85)" font-family="sans-serif" font-size="10">Judge: 10 (pass) → PASS</text>
<text x="340" y="496" text-anchor="middle" fill="rgb(85,85,85)" font-family="sans-serif" font-size="10">e.g. Emb: 0.52 (fail)</text>
<text x="340" y="508" text-anchor="middle" fill="rgb(85,85,85)" font-family="sans-serif" font-size="10">Judge: 9 (pass) → PASS</text>

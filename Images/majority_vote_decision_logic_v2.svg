<text x="120" y="272" text-anchor="middle" dominant-baseline="central" fill="rgb(17,17,17)" font-family="sans-serif" font-size="12" font-weight="600">Run 1: PASS</text>

<rect x="296" y="258" width="88" height="28" rx="4" fill="rgb(255,255,255)" stroke="rgb(34,34,34)" stroke-width="1.2"/>
